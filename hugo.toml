baseURL = "https://teddyrookbookclub.com/"
title = "Teddy Rook Book Club"
theme = "PaperMod"
languageCode = "en"
defaultContentLanguage = "en"

# Appearance
paginate = 10
summaryLength = 30

# Menu (we'll expand later)
[[menu.main]]
name = "Reading List"
url = "/#my-reading-list"
weight = 1


# PaperMod settings
[params]
  author = "Teddy Rook"
  description = "A personal reading list and notes on the Great Books — Harvard Classics, Great Books of the Western World, and beyond."
  defaultTheme = "auto"        # light/dark/auto
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true

  # Branding colors — British Racing Green
  [params.style]
    mainColor = "#004C2A"      # British Racing Green